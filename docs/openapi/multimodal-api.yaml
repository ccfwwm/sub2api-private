          description: 余额/额度不足，未生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                model: &id003
                  type: string
                  minLength: 1
                prompt:
                  type: string
                seconds:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: ^[1-9][0-9]*$
                duration:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: ^[1-9][0-9]*$
                ratio: *id003
                aspect_ratio: *id003
                resolution: *id003
                size: *id003
                image:
                  type: string
                  format: binary
                image_url: *id003
                image_urls:
                  type: array
                  items: *id003
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                videos:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                audios:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                reference_image_urls:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                reference_video_urls:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                reference_audio_urls:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                input_reference:
                  type: string
                  format: binary
                generate_audio:
                  type: boolean
                generateAudio:
                  type: boolean
                negative_prompt:
                  type: string
                negativePrompt:
                  type: string
                metadata:
                  type: object
                public_profile_id:
                  type: string
                  pattern: ^mp_[0-9a-f]{64}$
                  description: 可选；精确选择登录能力目录中的配置。
                video:
                  type: string
                  format: binary
                audio:
                  type: string
                  format: binary
              required:
              - model
              additionalProperties: false
            encoding:
              metadata:
                contentType: application/json
            x-model-gated: true
      parameters:
      - name: Idempotency-Key
        in: header
        schema: *id002
        description: 建议必传；服务端以Key+规范化operation+请求hash约束。
