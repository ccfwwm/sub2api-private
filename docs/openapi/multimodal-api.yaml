components:
  securitySchemes:
    DownstreamKey:
      type: http
      scheme: bearer
    GeminiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
    UserSession:
      type: http
      scheme: bearer
      description: 现有用户登录JWT，不是下游API Key。
    AdminSession:
      type: http
      scheme: bearer
      description: 现有管理员认证token，非下游API Key；沿用权限及敏感操作验证。
  schemas:
    Duration:
      type: object
      properties:
        mode:
          type: string
          enum:
          - enum
          - range
          - fixed
          - hint
          - unknown
          - not_applicable
        values:
          type: array
          items:
            type: integer
            minimum: 1
        min:
          type:
          - integer
          - 'null'
          minimum: 0
        max:
          type:
          - integer
          - 'null'
          minimum: 0
        default:
          type:
          - integer
          - 'null'
          minimum: 0
        required:
          type: boolean
        scenarios:
          type: array
          items:
            type: object
      required:
      - mode
      - values
      - min
      - max
      - default
      - required
      - scenarios
      additionalProperties: false
    Material:
      type: object
      properties:
        formats:
          type: array
          items:
            type: string
            minLength: 1
        max_count:
          type:
          - integer
          - 'null'
          minimum: 0
        max_file_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        max_duration_seconds:
          type:
          - string
          - 'null'
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      required:
      - formats
      - max_count
      - max_file_bytes
      - max_duration_seconds
      additionalProperties: false
    Capability:
      type: object
      properties:
        profile_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        upstream_model:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
          - yunfei
          - v6k
        adapter:
          type: string
          minLength: 1
        media_type:
          type: string
          enum:
          - image
          - video
          - audio
        enabled:
          type: boolean
        status:
          type: string
          enum:
          - draft
          - enabled
          - disabled
        validation_status:
          type: string
          enum:
          - 源码已有基础
          - 参考服务声明验证
          - 待开发
          - 待渠道验证
          - 本项目实测通过
        source:
          type: string
          minLength: 1
        scenarios:
          type: array
          items:
            type: string
            minLength: 1
        operations:
          type: array
          items:
            type: string
            minLength: 1
        formats:
          type: array
          items:
            type: string
            minLength: 1
        duration:
          $ref: '#/components/schemas/Duration'
        resolutions:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
          uniqueItems: true
        sizes:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
          uniqueItems: true
        aspect_ratios:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
          uniqueItems: true
        qualities:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
          uniqueItems: true
        resolution_policy:
          type: string
          enum:
          - enum
          - omit
          - unknown
          - native
        materials:
          type: object
          properties:
            image:
              $ref: '#/components/schemas/Material'
            video:
              $ref: '#/components/schemas/Material'
            audio:
              $ref: '#/components/schemas/Material'
          required:
          - image
          - video
          - audio
          additionalProperties: false
        field_mapping:
          type: object
          additionalProperties:
            type: string
