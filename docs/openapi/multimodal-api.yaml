openapi: 3.1.0
info:
  title: Sub2API 多模态 API 实施规格（非已部署承诺）
  version: 1.0.0-draft
  description: v0.2.15基础上的媒体运行时接口。模型受能力和发布价卡门控，模板默认关闭；实测范围见REAL_CHANNEL_VALIDATION.md。接口存在不表示所有模型验证通过。
servers:
- url: https://your-sub2api.example
