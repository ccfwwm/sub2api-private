map $http_upgrade $hkcode_connection_upgrade {
    default upgrade;
    '' '';
}

upstream hkcode_origin {
    server code.aicodeme.xyz:443;
    keepalive 64;
}

proxy_cache_path /var/cache/nginx/hkcode
    levels=1:2
    keys_zone=hkcode_assets:50m
    max_size=2g
    inactive=7d
    use_temp_path=off;
