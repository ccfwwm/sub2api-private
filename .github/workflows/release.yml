name: Private Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable private tag, e.g. v1.0.0 (does not deploy production)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: make test-frontend
      - run: make -C backend test-unit
      - run: make -C backend test-integration
      - run: python3 -m unittest discover -s deploy/private -p 'test_*.py' -v
  image:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccfwwm/sub2api-private:${{ needs.validate.outputs.tag }}
          build-args: |
            VERSION=${{ needs.validate.outputs.tag }}
            COMMIT=${{ needs.validate.outputs.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/ccfwwm/sub2api-private
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image with isolated database and Redis
        env:
          IMAGE: ghcr.io/ccfwwm/sub2api-private@${{ steps.build.outputs.digest }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: python3 deploy/private/smoke_image.py --image "$IMAGE" --version "$TAG"
      - name: Publish validated release inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          python3 deploy/private/release_manifest.py --version "$TAG" --digest "$DIGEST" --output deployment.json
          sha256sum deployment.json > checksums.txt
          gh release create "$TAG" deployment.json checksums.txt --verify-tag --target "$SHA" --title "Sub2API Private $TAG" --notes "Validated private image. Production deployment is manual; no production service was changed by this release."
