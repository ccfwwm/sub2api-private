name: Sub2API Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v1.2.19 (publish a public Release; no production switch)'
        required: true
        type: string
      candidate:
        description: 'Validate the selected branch commit without creating a version tag or Release'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sub2api-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
      image_tag: ${{ steps.ref.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.candidate || false }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          if [ "$CANDIDATE" = true ]; then
            SHA=$(git rev-parse HEAD)
            IMAGE_TAG="sha-$SHA"
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo 'This release is already published; use a new version.' >&2
              exit 1
            fi
            SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            IMAGE_TAG="$TAG"
          fi
          git merge-base --is-ancestor "$SHA" origin/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      media-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: media-ci-isolated-only
          POSTGRES_DB: media_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d media_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check reachable Go vulnerabilities before packaging
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Check production frontend dependencies before packaging
        run: |
          # Keep the complete inventory; the checker applies the high/critical policy.
          pnpm --dir frontend audit --prod --registry=https://registry.npmjs.org --json > frontend/audit.json || true
          python3 -m unittest discover -s tools -p 'test_check_pnpm_audit_exceptions.py' -v
          python3 tools/check_pnpm_audit_exceptions.py --audit frontend/audit.json --exceptions .github/audit-exceptions.yml
      - run: make test-frontend
      - run: make -C backend test-unit
      - name: Install media integration test dependencies
        run: |
          # Azure's HTTP mirror can stall every package retry on hosted runners.
          # Keep the dependency check reproducible with the official HTTPS archive.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if path.exists():
                  text = path.read_text()
                  text = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  path.write_text(text)
          PY
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - run: make -C backend test-integration
        env:
          MEDIA_TEST_DATABASE_URL: postgres://postgres:media-ci-isolated-only@127.0.0.1:5432/media_ci?sslmode=disable
      - run: python3 -m pip install -r docs/multimodal/requirements-spec.txt
      - run: python3 docs/multimodal/verify_spec.py
      - run: python3 docs/multimodal/test_public_clients.py
      - run: python3 -m unittest discover -s deploy/private -p 'test_*.py' -v
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
  image:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck that a release was not published during source tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          CANDIDATE: ${{ inputs.candidate || false }}
        run: |
          python3 - <<'PY'
          import os,urllib.error,urllib.request
          if os.environ['CANDIDATE'] != 'true':
              url='https://api.github.com/repos/ccfwwm/sub2api-private/releases/tags/' + os.environ['TAG']
              req=urllib.request.Request(url,headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  urllib.request.urlopen(req,timeout=30).close()
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise SystemExit('Release was published while this run was testing; refusing to overwrite its image tag.')
          PY
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccfwwm/sub2api-private:${{ needs.validate.outputs.image_tag }}
          build-args: |
            VERSION=${{ needs.validate.outputs.tag }}
            COMMIT=${{ needs.validate.outputs.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/ccfwwm/sub2api-private
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: build-docs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccfwwm/sub2api-private-docs:${{ needs.validate.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/ccfwwm/sub2api-private
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          cache-from: type=gha,scope=docs-web
          cache-to: type=gha,mode=max,scope=docs-web
      - name: Verify image with isolated database and Redis
        env:
          IMAGE: ghcr.io/ccfwwm/sub2api-private@${{ steps.build.outputs.digest }}
          DOCS_IMAGE: ghcr.io/ccfwwm/sub2api-private-docs@${{ steps.build-docs.outputs.digest }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: python3 deploy/private/smoke_image.py --image "$IMAGE" --version "$TAG"
      - name: Verify documentation image health
        env:
          DOCS_IMAGE: ghcr.io/ccfwwm/sub2api-private-docs@${{ steps.build-docs.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$DOCS_IMAGE"
          docker image inspect "$DOCS_IMAGE" > docs-image-inspect.json
          docker run -d --name sub2api-docs-ci "$DOCS_IMAGE"
          trap 'docker rm -f sub2api-docs-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker run --rm --network container:sub2api-docs-ci curlimages/curl:8.12.1 -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify public repository and image visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/ccfwwm/sub2api-private --jq '.private' | grep -qx false
          gh api users/ccfwwm/packages/container/sub2api-private --jq '.visibility' | grep -qx public
          gh api users/ccfwwm/packages/container/sub2api-private-docs --jq '.visibility' | grep -qx public
          docker logout ghcr.io
          docker pull ghcr.io/ccfwwm/sub2api-private@${{ steps.build.outputs.digest }}
          docker pull ghcr.io/ccfwwm/sub2api-private-docs@${{ steps.build-docs.outputs.digest }}
      - name: Publish validated release inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ needs.validate.outputs.sha }}
          CANDIDATE: ${{ inputs.candidate || false }}
        run: |
          python3 deploy/private/release_manifest.py --version "$TAG" --digest "$DIGEST" --docs-digest "${{ steps.build-docs.outputs.digest }}" --output deployment.json
          sudo install -d -m 755 /run/sub2api-deployer
          echo 'Runner disk before rehearsal:'
          df -h /
          docker system df || true
          docker builder prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo 'Runner disk after cleanup:'
          df -h /
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 deploy/private/rehearse_fixture.py --manifest deployment.json
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 deploy/private/rehearse_fixture.py --manifest deployment.json --ops
          sha256sum deployment.json docs-image-inspect.json > checksums.txt
          cp backend/migrations/243_media_tasks_and_pricing.sql ./243_media_tasks_and_pricing.sql
          cp backend/migrations/244_unified_media_model_pricing.sql ./244_unified_media_model_pricing.sql
          cp backend/migrations/245_unified_media_account_cost.sql ./245_unified_media_account_cost.sql
          cp backend/migrations/246_channel_monitor_imagevideo.sql ./246_channel_monitor_imagevideo.sql
          cp backend/migrations/247_media_task_list_indexes.sql ./247_media_task_list_indexes.sql
          cp backend/migrations/248_public_imagevideo_docs.sql ./248_public_imagevideo_docs.sql
          cp backend/migrations/249_media_protocol_templates.sql ./249_media_protocol_templates.sql
          cp backend/migrations/250_migrate_legacy_media_template_refs.sql ./250_migrate_legacy_media_template_refs.sql
          cp backend/migrations/251_media_group_availability.sql ./251_media_group_availability.sql
          cp backend/migrations/252_media_account_concurrency_diagnostics.sql ./252_media_account_concurrency_diagnostics.sql
          sha256sum 243_media_tasks_and_pricing.sql >> checksums.txt
          sha256sum 244_unified_media_model_pricing.sql 245_unified_media_account_cost.sql 246_channel_monitor_imagevideo.sql >> checksums.txt
          sha256sum 247_media_task_list_indexes.sql >> checksums.txt
          sha256sum 248_public_imagevideo_docs.sql >> checksums.txt
          sha256sum 249_media_protocol_templates.sql >> checksums.txt
          sha256sum 250_migrate_legacy_media_template_refs.sql >> checksums.txt
          sha256sum 251_media_group_availability.sql >> checksums.txt
          sha256sum 252_media_account_concurrency_diagnostics.sql >> checksums.txt
          git rev-parse HEAD > management-source.txt
          tar -czf server-management.tar.gz -C deploy/private manage.py controller.py media_migrate.py install-manager.sh SERVER-MANAGEMENT.md auto_deploy.py
          sha256sum server-management.tar.gz management-source.txt > management-checksums.txt
          if [ "$CANDIDATE" != true ]; then
            gh release create "$TAG" deployment.json docs-image-inspect.json checksums.txt *.sql server-management.tar.gz management-source.txt management-checksums.txt --verify-tag --latest --target "$SHA" --title "Sub2API $TAG" --notes-file "docs/multimodal/RELEASE-$TAG.md"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: validated-deployment
          path: |
            deployment.json
            checksums.txt
            243_media_tasks_and_pricing.sql
            244_unified_media_model_pricing.sql
            245_unified_media_account_cost.sql
            246_channel_monitor_imagevideo.sql
            247_media_task_list_indexes.sql
            248_public_imagevideo_docs.sql
            249_media_protocol_templates.sql
            250_migrate_legacy_media_template_refs.sql
            251_media_group_availability.sql
            252_media_account_concurrency_diagnostics.sql
            docs-image-inspect.json
