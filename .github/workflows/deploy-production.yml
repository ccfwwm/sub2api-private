name: Manual Production Deployment
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved formal release vMAJOR.MINOR.PATCH'
        required: false
        type: string
      verify_only:
        description: 'Verify new production SSH, images and health without changing business code'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sub2api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify new production without release
        if: inputs.verify_only
        run: bash deploy/new-production/client.sh verify
      - name: Validate formal release and package immutable migration inventory
        if: ${{ !inputs.verify_only }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ccfwwm/sub2api-private
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/release"
          gh api "repos/$GH_REPO/releases/tags/$VERSION" > "$RUNNER_TEMP/release/release.json"
          python3 - "$RUNNER_TEMP/release/release.json" "$VERSION" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert not r['draft'] and not r['prerelease'] and r['tag_name']==sys.argv[2]
          PY
          gh release download "$VERSION" --repo "$GH_REPO" --dir "$RUNNER_TEMP/release" --pattern deployment.json --pattern checksums.txt
          python3 - "$RUNNER_TEMP/release" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]); lines=(root/'checksums.txt').read_text().splitlines()
          expected=[line.split()[0] for line in lines if line.split()[-1]=='deployment.json']
          assert len(expected)==1 and hashlib.sha256((root/'deployment.json').read_bytes()).hexdigest()==expected[0]
          PY
          git fetch --depth=1 origin "tag" "$VERSION"
          revision=$(git rev-parse 'FETCH_HEAD^{commit}')
          manifest_revision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$RUNNER_TEMP/release/deployment.json")
          test "$revision" = "$manifest_revision"
          git show "FETCH_HEAD:docs/multimodal/CHANNEL_VERIFICATION_CURRENT.json" > "$RUNNER_TEMP/release/channel-verification.json"
          python3 - "$RUNNER_TEMP/release" "$VERSION" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); m=json.loads((root/'deployment.json').read_text())
          r=m['channel_verification_record']; assert r['path']=='docs/multimodal/CHANNEL_VERIFICATION_CURRENT.json'
          data=(root/'channel-verification.json').read_bytes(); assert hashlib.sha256(data).hexdigest()==r['sha256']
          r=json.loads(data); assert r['version']==sys.argv[2] and r['status']=='recorded'
          PY
          comparison=$(gh api "repos/$GH_REPO/compare/$revision...main" --jq .status)
          [[ "$comparison" == identical || "$comparison" == ahead ]]
          git archive FETCH_HEAD backend/migrations | tar -x -C "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/release/backend/migrations" "$RUNNER_TEMP/release/migrations"
          rm -rf "$RUNNER_TEMP/release/backend"
          tar -C "$RUNNER_TEMP/release" -czf "$RUNNER_TEMP/release.tar.gz" deployment.json release.json checksums.txt channel-verification.json migrations
          bash deploy/new-production/client.sh "$VERSION" "$RUNNER_TEMP/release.tar.gz"
