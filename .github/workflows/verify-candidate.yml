name: Verify Candidate Controller
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Digest of an existing private candidate image (no release or production operation)'
        required: true
        type: string
      version:
        description: 'Embedded image version'
        required: true
        default: v0.2.15
        type: string
      operations:
        description: 'Also test server management backup/restore/upgrade scripts'
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise controller with disposable data
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS: ${{ inputs.operations }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          IMAGE="ghcr.io/ccfwwm/sub2api-private@$DIGEST"
          docker pull "$IMAGE"
          gh api users/ccfwwm/packages/container/sub2api-private --jq '.visibility' | grep -qx private
          python3 deploy/private/smoke_image.py --image "$IMAGE" --version "$VERSION"
          python3 deploy/private/release_manifest.py --version "$VERSION" --digest "$DIGEST" --output deployment.json
          # This workflow verifies new host-controller code against an existing
          # image. It never publishes a Release or claims the image uses HEAD.
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' > image-commit.txt
          python3 -c 'import json,pathlib; p=pathlib.Path("deployment.json"); m=json.loads(p.read_text()); m["commit"]=pathlib.Path("image-commit.txt").read_text().strip(); p.write_text(json.dumps(m))'
          sudo install -d -m 755 /run/sub2api-deployer
          echo 'Runner disk before rehearsal:'
          df -h /
          docker system df || true
          docker builder prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo 'Runner disk after cleanup:'
          df -h /
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 deploy/private/rehearse_fixture.py --manifest deployment.json
          if [ "$OPS" = true ]; then
            sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 deploy/private/rehearse_fixture.py --manifest deployment.json --ops
          fi

