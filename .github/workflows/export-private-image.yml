name: Export Validated Private Image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published private release to export for offline image staging'
        required: true
        default: v1.0.0
        type: string
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export published image and verify release identity
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          mkdir export
          gh release download "$VERSION" --pattern deployment.json --pattern checksums.txt --pattern '*.sql' --dir export
          (cd export && sha256sum -c checksums.txt)
          IMAGE=$(python3 -c 'import json,sys; sys.path.insert(0,"deploy/private"); from controller import validate_manifest; print(validate_manifest(json.load(open("export/deployment.json")),sys.argv[1]))' "$VERSION")
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > export/image-inspect.json
          python3 - <<'PY'
          import json
          m = json.load(open('export/deployment.json'))
          i = json.load(open('export/image-inspect.json'))[0]
          assert i['Config']['Labels']['org.opencontainers.image.revision'] == m['commit']
          assert i['Os'] == 'linux' and i['Architecture'] == 'amd64'
          PY
          docker tag "$IMAGE" "ghcr.io/ccfwwm/sub2api-private:$VERSION"
          docker save "ghcr.io/ccfwwm/sub2api-private:$VERSION" | gzip -1 > export/image.tar.gz
          (cd export && sha256sum deployment.json image-inspect.json image.tar.gz > offline-checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: private-image-${{ inputs.version }}
          path: export/
          retention-days: 3
          compression-level: 0
