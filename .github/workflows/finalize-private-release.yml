name: Validate and Finalize Existing Image
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      digest:
        required: true
        type: string
      docs_digest:
        description: 'Validated docs-web image digest'
        required: true
        type: string
      build_run:
        description: 'Sub2API Release run whose exact source passed the test job'
        required: true
        type: string
permissions:
  contents: write
  packages: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          path: tooling
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify provenance and rehearse exact image in a fresh runner
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
          BUILD_RUN: ${{ inputs.build_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          SHA=$(git rev-parse HEAD)
          gh api "repos/ccfwwm/sub2api-private/actions/runs/$BUILD_RUN" > build-run.json
          gh api "repos/ccfwwm/sub2api-private/actions/runs/$BUILD_RUN/jobs?per_page=100" > build-jobs.json
          python3 - "$SHA" <<'PY'
          import json,sys
          run=json.load(open('build-run.json'))
          assert run['head_sha']==sys.argv[1]
          assert run['path']=='.github/workflows/release.yml'
          assert run['name'] in ('Private Release', 'Sub2API Release')
          jobs=json.load(open('build-jobs.json'))['jobs']
          assert any(j['name']=='test' and j['conclusion']=='success' for j in jobs)
          PY
          IMAGE="ghcr.io/ccfwwm/sub2api-private@$DIGEST"
          DOCS_IMAGE="ghcr.io/ccfwwm/sub2api-private-docs@${{ inputs.docs_digest }}"
          docker pull "$IMAGE"
          docker pull "$DOCS_IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
          test "$(docker image inspect "$DOCS_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
          gh api repos/ccfwwm/sub2api-private --jq '.private' | grep -qx false
          gh api users/ccfwwm/packages/container/sub2api-private --jq '.visibility' | grep -qx public
          gh api users/ccfwwm/packages/container/sub2api-private-docs --jq '.visibility' | grep -qx public
          docker logout ghcr.io
          docker pull "$IMAGE"
          docker pull "$DOCS_IMAGE"
          python3 tooling/deploy/private/smoke_image.py --image "$IMAGE" --version "$VERSION"
          docker run -d --name sub2api-docs-finalize "$DOCS_IMAGE"
          trap 'docker rm -f sub2api-docs-finalize >/dev/null 2>&1 || true' EXIT
          DOCS_HEALTHY=false
          for i in $(seq 1 30); do
            if docker run --rm --network container:sub2api-docs-finalize curlimages/curl:8.12.1 -fsS http://127.0.0.1:8080/health; then DOCS_HEALTHY=true; break; fi
            sleep 2
          done
          test "$DOCS_HEALTHY" = true
          docker image inspect "$DOCS_IMAGE" > docs-image-inspect.json
          docker rm -f sub2api-docs-finalize >/dev/null
          python3 deploy/private/release_manifest.py --version "$VERSION" --digest "$DIGEST" --docs-digest "${{ inputs.docs_digest }}" --output deployment.json
          python3 -m unittest discover -s tooling/deploy/private -p 'test_*.py' -v
          sudo install -d -m 755 /run/sub2api-deployer
          echo 'Runner disk before rehearsal:'
          df -h /
          docker system df || true
          docker builder prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo 'Runner disk after cleanup:'
          df -h /
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 tooling/deploy/private/rehearse_fixture.py --manifest deployment.json
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 tooling/deploy/private/rehearse_fixture.py --manifest deployment.json --ops
          git rev-parse HEAD > management-source.txt
          tar -czf server-management.tar.gz -C deploy/private manage.py controller.py media_migrate.py install-manager.sh SERVER-MANAGEMENT.md auto_deploy.py capacity_collect.py capacity_report.py -C deploy docker-compose.capacity.yml
          sha256sum deployment.json docs-image-inspect.json > checksums.txt
          cp backend/migrations/24{3,4,5,6,7}_*.sql .
          cp backend/migrations/248_public_imagevideo_docs.sql .
          cp backend/migrations/249_media_protocol_templates.sql .
          cp backend/migrations/250_migrate_legacy_media_template_refs.sql .
          cp backend/migrations/251_media_group_availability.sql .
          cp backend/migrations/252_media_account_concurrency_diagnostics.sql .
          cp backend/migrations/253_scoped_admin_api_keys.sql .
          cp backend/migrations/254_group_image_count_billing.sql .
          sha256sum 243_media_tasks_and_pricing.sql 244_unified_media_model_pricing.sql 245_unified_media_account_cost.sql 246_channel_monitor_imagevideo.sql 247_media_task_list_indexes.sql 248_public_imagevideo_docs.sql 249_media_protocol_templates.sql 250_migrate_legacy_media_template_refs.sql >> checksums.txt
          sha256sum 251_media_group_availability.sql 252_media_account_concurrency_diagnostics.sql >> checksums.txt
          sha256sum 253_scoped_admin_api_keys.sql 254_group_image_count_billing.sql >> checksums.txt
          sha256sum server-management.tar.gz management-source.txt > management-checksums.txt
          gh release create "$VERSION" deployment.json docs-image-inspect.json checksums.txt 24{3,4,5,6,7,8,9}_*.sql 250_migrate_legacy_media_template_refs.sql 251_media_group_availability.sql 252_media_account_concurrency_diagnostics.sql 253_scoped_admin_api_keys.sql 254_group_image_count_billing.sql server-management.tar.gz management-source.txt management-checksums.txt --verify-tag --latest --target "$SHA" --title "Sub2API $VERSION" --notes "Public Sub2API release. Application and documentation images support anonymous pulls. Exact images were validated after source tests, application smoke, documentation health, backup/restore, cutover, rollback and emergency rescue. Production deployment is a separate operation through the host manager."
