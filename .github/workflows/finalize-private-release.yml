name: Validate and Finalize Existing Image
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      digest:
        required: true
        type: string
      build_run:
        description: 'Private Release run whose exact source passed the test job'
        required: true
        type: string
permissions:
  contents: write
  packages: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          path: tooling
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify provenance and rehearse exact image in a fresh runner
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
          BUILD_RUN: ${{ inputs.build_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 1; fi
          SHA=$(git rev-parse HEAD)
          gh api "repos/ccfwwm/sub2api-private/actions/runs/$BUILD_RUN" > build-run.json
          gh api "repos/ccfwwm/sub2api-private/actions/runs/$BUILD_RUN/jobs?per_page=100" > build-jobs.json
          python3 - "$SHA" <<'PY'
          import json,sys
          run=json.load(open('build-run.json'))
          assert run['head_sha']==sys.argv[1] and run['name']=='Private Release'
          jobs=json.load(open('build-jobs.json'))['jobs']
          assert any(j['name']=='test' and j['conclusion']=='success' for j in jobs)
          PY
          IMAGE="ghcr.io/ccfwwm/sub2api-private@$DIGEST"
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
          gh api repos/ccfwwm/sub2api-private --jq '.private' | grep -qx true
          gh api users/ccfwwm/packages/container/sub2api-private --jq '.visibility' | grep -qx private
          python3 tooling/deploy/private/smoke_image.py --image "$IMAGE" --version "$VERSION"
          python3 deploy/private/release_manifest.py --version "$VERSION" --digest "$DIGEST" --output deployment.json
          python3 -m unittest discover -s tooling/deploy/private -p 'test_*.py' -v
          sudo install -d -m 755 /run/sub2api-deployer
          echo 'Runner disk before rehearsal:'
          df -h /
          docker system df || true
          docker builder prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo 'Runner disk after cleanup:'
          df -h /
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 tooling/deploy/private/rehearse_fixture.py --manifest deployment.json
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SUB2API_REHEARSAL_MIN_FREE_BYTES=4294967296 SUB2API_REHEARSAL_DISK_MULTIPLIER=2 DOCKER_CONFIG="$HOME/.docker" python3 tooling/deploy/private/rehearse_fixture.py --manifest deployment.json --ops
          git rev-parse HEAD > management-source.txt
          tar -czf server-management.tar.gz -C deploy/private manage.py controller.py media_migrate.py install-manager.sh SERVER-MANAGEMENT.md auto_deploy.py
          sha256sum deployment.json > checksums.txt
          cp backend/migrations/24{3,4,5,6,7}_*.sql .
          sha256sum 24{3,4,5,6,7}_*.sql >> checksums.txt
          sha256sum server-management.tar.gz management-source.txt > management-checksums.txt
          gh release create "$VERSION" deployment.json checksums.txt 24{3,4,5,6,7}_*.sql server-management.tar.gz management-source.txt management-checksums.txt --verify-tag --latest --target "$SHA" --title "Sub2API Private $VERSION" --notes "Exact image validated in a clean runner after source tests, application smoke, backup/restore, cutover, rollback and emergency rescue. Formal releases deploy automatically through the restricted host manager after backup and restore verification."


  deploy:
    needs: finalize
    uses: ./.github/workflows/deploy-production.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
