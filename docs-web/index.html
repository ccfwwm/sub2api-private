<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词元互联图片、视频与音乐接口文档</title>
  <style>
    :root{--bg:#fafbf8;--panel:#fff;--code:#f3f5f0;--ink:#263027;--muted:#687465;--accent:#496815;--accent-bg:#eff5df;--line:#dce3d6}
    [data-theme=dark]{--bg:#101310;--panel:#171c16;--code:#141a12;--ink:#e9eee1;--muted:#a0ab95;--accent:#d5fa42;--accent-bg:#202915;--line:#34402c;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 "PingFang SC","Microsoft YaHei",sans-serif}
    button,a{color:inherit;font:inherit;background:none;border:0;cursor:pointer;text-decoration:none}button:hover,a:hover{color:var(--accent)}
    aside{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:268px;padding:30px 24px 22px;border-right:1px solid var(--line);overflow:auto;background:var(--bg);z-index:4}aside h2{margin:0 0 24px;font-size:21px}aside h2 span{color:var(--accent);float:right}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.1em;margin:0 0 12px}.group{margin:16px 0}.group b{font-size:12px}.group a{display:block;padding:6px 12px;border-left:2px solid var(--line);color:var(--muted);font-size:12px}.group a.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}.foot{margin-top:auto;padding-top:24px;color:var(--muted);font-size:11px}.foot code{color:var(--accent);overflow-wrap:anywhere}
    main{margin-left:268px;max-width:1420px;padding:0 56px}.top{display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.actions{display:flex;gap:18px;color:var(--accent)}.hero{padding:54px 0 48px}.hero h1{font:700 clamp(34px,3.7vw,54px)/1.4 Georgia,"Songti SC",serif;max-width:860px;margin:0}.hero h1 span{display:block}.lead{color:var(--muted);font-size:16px;margin:20px 0}.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{color:var(--accent);border:1px solid var(--line);background:var(--accent-bg);padding:3px 12px;border-radius:4px;font-size:12px}.origin{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:24px;padding:16px 20px;border:1px solid var(--line);background:var(--panel);border-radius:6px}.origin code{color:var(--accent);overflow-wrap:anywhere}.origin button{margin-left:auto;color:var(--accent);font-size:12px}.section{padding:38px 0;border-top:1px solid var(--line);scroll-margin-top:24px}.product{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;background:var(--accent-bg);color:var(--accent);border-radius:6px;margin-bottom:26px}.section-head{display:flex;justify-content:space-between;gap:16px}.section h2{font:700 32px/1.4 Georgia,"Songti SC",serif;margin:0}.subtitle,.text{color:var(--muted)}.subtitle{margin:8px 0 20px}.text{white-space:pre-wrap;margin:20px 0}.heading{color:var(--accent);font-weight:700;margin:26px 0 8px}.endpoint{display:flex;gap:14px;align-items:flex-start;padding:13px 17px;border:1px solid var(--line);background:var(--panel);border-radius:5px;margin:16px 0}.endpoint b{color:var(--accent);font:700 12px Consolas,monospace}.endpoint code{overflow-wrap:anywhere}.endpoint button{margin-left:auto;color:var(--accent);font-size:11px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:5px;margin:18px 0}.table-wrap table{width:100%;min-width:540px;border-collapse:collapse;text-align:left;font-size:12px}.table-wrap th{padding:11px 14px;background:var(--accent-bg);color:var(--accent)}.table-wrap td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;background:var(--panel);color:var(--muted);white-space:pre-wrap}.table-wrap td:first-child{color:var(--ink);font-family:Consolas,monospace}.code{margin:18px 0;border:1px solid var(--line);border-radius:6px;background:var(--code);overflow:hidden}.code-head{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.code-head button{color:var(--accent)}pre{margin:0;padding:16px;overflow:auto;max-height:560px;font:12px/1.8 Consolas,monospace}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:9px 22px;background:var(--accent);color:var(--bg);border-radius:5px;z-index:9}.mobile{display:none}
    @media(max-width:900px){.mobile{display:flex;position:fixed;top:0;left:0;right:0;z-index:5;justify-content:space-between;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line);color:var(--accent)}aside{transform:translateX(-100%);transition:transform .2s;width:280px;padding-top:70px}aside.open{transform:translateX(0)}.mask{position:fixed;inset:0;background:#0008;z-index:3}main{margin-left:0;padding:58px 20px 0}.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.hero{padding:32px 0}.hero h1{font-size:34px}.section-head{flex-wrap:wrap}.section h2{font-size:27px}.endpoint{flex-wrap:wrap}.endpoint button{margin-left:0}.foot{display:none}}
  </style>
</head>
<body>
  <div class="mobile"><b>词元互联</b><button id="menu">目录 ☰</button></div><div id="mask"></div>
  <aside id="nav"><h2>词元互联 <span>↗</span></h2><p class="eyebrow">MEDIA API / DOCUMENTATION</p><nav id="menuList"></nav><div class="foot"><p>API BASE</p><code>https://code.aicodeme.xyz</code><p id="version">已发布文档</p><a href="/keys">管理 API Key ↗</a></div></aside>
  <main><div class="top"><span>IMAGEVIDEO · 开发者指南</span><div class="actions"><button id="theme">☾ 深色</button><button id="download">下载完整 Markdown</button><button id="copyAll">复制完整 Markdown ↗</button></div></div><header class="hero"><p class="eyebrow">CREATE WITH ONE API</p><h1><span>词元互联</span>图片、视频与音乐接口文档</h1><p class="lead">每种调用场景独立列出接口地址、请求参数、示例与响应。</p><div class="tags"><span>图片生成</span><span>视频创作</span><span>音乐生成</span></div><div class="origin"><span>统一接口地址</span><code>https://code.aicodeme.xyz</code><button data-copy="https://code.aicodeme.xyz">复制</button></div></header><div id="content"><p class="text">正在读取已发布的接口文档…</p></div><footer class="text" style="border-top:1px solid var(--line);padding:26px 0">词元互联 · <span id="footerVersion"></span><a href="#start" style="float:right;color:var(--accent)">返回顶部 ↑</a></footer></main><div id="notice" class="notice" hidden></div>
  <script>
    const ORIGIN='https://code.aicodeme.xyz';let sections=[],version='',observer;const previewMode=new URLSearchParams(location.search).get('preview')==='1' && window.parent!==window;
    const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cell=v=>String(v??'').replace(/\|/g,'\\|').replace(/\n/g,'<br>');
    function markdown(s){return `## ${s.title}\n\n${s.subtitle}\n\n`+s.blocks.map(b=>b.kind==='text'?b.text:b.kind==='heading'?`### ${b.text}`:b.kind==='endpoint'?`**${b.method}** ${ORIGIN}${b.path}`:b.kind==='code'?`### ${b.label}\n\n\`\`\`${b.language}\n${b.text}\n\`\`\``:'| '+b.headers.map(cell).join(' | ')+' |\n| '+b.headers.map(()=> '---').join(' | ')+' |\n'+b.rows.map(r=>'| '+r.map(cell).join(' | ')+' |').join('\n')).join('\n\n')}
    function notice(message){const n=$('#notice');n.textContent=message;n.hidden=false;setTimeout(()=>n.hidden=true,2400)}
    async function copy(v){try{await navigator.clipboard.writeText(v);notice('已复制')}catch{notice('复制失败，请选择内容手动复制')}}
    function download(text,name,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function closeMenu(){$('#nav').classList.remove('open');$('#mask').className=''}
    function block(b){if(b.kind==='text')return `<p class="text">${esc(b.text)}</p>`;if(b.kind==='heading')return `<h3 class="heading">${esc(b.text)}</h3>`;if(b.kind==='endpoint')return `<div class="endpoint"><b>${esc(b.method)}</b><code>${ORIGIN}${esc(b.path)}</code><button data-copy="${esc(ORIGIN+b.path)}">复制地址</button></div>`;if(b.kind==='table')return `<div class="table-wrap"><table><thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;return `<div class="code"><div class="code-head"><span>${esc(b.label)}</span>${b.language==='python'||b.language==='javascript'?`<button data-download="${esc(b.text)}" data-name="imagevideo.${b.language==='python'?'py':'mjs'}">下载示例</button>`:''}<button data-copy="${esc(b.text)}">复制代码</button></div><pre><code>${esc(b.text)}</code></pre></div>`}
    function render(){observer?.disconnect();const groups=[...new Set(sections.map(s=>s.group))];$('#menuList').innerHTML=groups.map(g=>`<div class="group"><b>${esc(g)}</b>${sections.filter(s=>s.group===g).map(s=>`<a href="#${esc(s.id)}">${esc(s.navTitle)}</a>`).join('')}</div>`).join('');$('#content').innerHTML=sections.map((s,i)=>`<section id="${esc(s.id)}" class="section"><div class="product"><b>${esc(s.group)}</b><button data-group="${esc(s.group)}">复制本组 Markdown</button></div><div class="section-head"><div><p class="eyebrow">${String(i+1).padStart(2,'0')} / API GUIDE</p><h2>${esc(s.title)}</h2><p class="subtitle">${esc(s.subtitle)}</p></div><button data-section="${esc(s.id)}" style="color:var(--accent)">复制为 Markdown ↗</button></div>${s.blocks.map(block).join('')}</section>`).join('');$('#version').textContent=`版本 v${version||'1'} · ${sections.length} 个章节`;$('#footerVersion').textContent=`v${version||'1'}`;document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=()=>copy(e.dataset.copy));document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>copy(markdown(sections.find(s=>s.id===e.dataset.section))));document.querySelectorAll('[data-group]').forEach(e=>e.onclick=()=>copy(sections.filter(s=>s.group===e.dataset.group).map(markdown).join('\n\n')));document.querySelectorAll('[data-download]').forEach(e=>e.onclick=()=>download(e.dataset.download,e.dataset.name));document.querySelectorAll('#menuList a').forEach(e=>e.onclick=closeMenu);observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){document.querySelectorAll('#menuList a').forEach(a=>a.classList.toggle('active',a.hash==='#'+entry.target.id));break}}},{rootMargin:'0px 0px -65% 0px'});document.querySelectorAll('.section').forEach(e=>observer.observe(e))}
    async function load(){try{const r=await fetch('/api/v1/public-docs/imagevideo',{cache:'no-store'});if(!r.ok)throw Error();const p=await r.json();if(!Array.isArray(p.data?.content)||!p.data.content.length)throw Error();sections=p.data.content;version=p.data.version;render()}catch{$('#content').innerHTML='<p class="text">文档暂时无法加载，请稍后刷新。</p>'}}
    function fullMarkdown(){return `# 词元互联图片、视频与音乐接口文档\n\n版本：v${version}\n\n根地址：${ORIGIN}\n\n`+sections.map(markdown).join('\n\n')}
    $('#copyAll').onclick=()=>copy(fullMarkdown());$('#download').onclick=()=>download(fullMarkdown(),'imagevideo.md','text/markdown');
    function theme(value){document.body.dataset.theme=value;$('#theme').textContent=value==='dark'?'☀ 浅色':'☾ 深色'}
    try{theme(localStorage.getItem('imagevideo-theme')||'')}catch{}
    $('#theme').onclick=()=>{const value=document.body.dataset.theme==='dark'?'':'dark';theme(value);try{localStorage.setItem('imagevideo-theme',value)}catch{}};
    $('#menu').onclick=()=>{const open=$('#nav').classList.toggle('open');$('#mask').className=open?'mask':''};$('#mask').onclick=closeMenu;
    if(previewMode){
      $('#content').innerHTML='<p class="text">正在读取草稿预览…</p>';
      window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='imagevideo-docs-preview'||!Array.isArray(event.data.content))return;sections=event.data.content;version=event.data.version;try{render();$('#version').textContent='草稿预览 · 未发布'}catch{$('#content').textContent='草稿结构不完整，请检查 JSON'}});
    }else{load()}
  </script>
</body>
</html>
